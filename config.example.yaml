# Пример конфигурации. Скопируйте в config.yaml и подставьте свою модель.
#
# Подходит любой OpenAI-совместимый провайдер: достаточно поменять
# api_base / api_key / model. Имя модели ниже — плейсхолдер.

model_list:
  - model_name: my-model                 # имя, которое видят клиенты
    litellm_params:
      model: openai/YOUR_MODEL_ID        # ID модели у провайдера
      api_base: os.environ/OPENAI_COMPATIBLE_API_BASE
      api_key: os.environ/OPENAI_COMPATIBLE_API_KEY
      # rpm: 60                          # лимит запросов в минуту (опционально)
      # tpm: 100000                      # лимит токенов в минуту (опционально)

  # Второй алиас на ту же модель — удобно для разных клиентов.
  - model_name: my-model-chat
    litellm_params:
      model: openai/YOUR_MODEL_ID
      api_base: os.environ/OPENAI_COMPATIBLE_API_BASE
      api_key: os.environ/OPENAI_COMPATIBLE_API_KEY

litellm_settings:
  # Сколько раз повторять запрос при ошибке провайдера.
  # num_retries=4 → всего до 5 попыток (1 + 4 ретрая).
  num_retries: 4
  # Таймаут одного запроса, сек. Для длинных coding-сессий нужен большой.
  request_timeout: 600
  # Не падать, если клиент прислал параметры, которых нет у модели.
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 4
  # Пауза между ретраями, сек.
  retry_after: 2
  # Сколько ошибок допускается до временного отключения модели (cooldown).
  allowed_fails: 4
  cooldown_time: 30
  # Фолбэк на другую модель, если основная недоступна (опционально).
  # fallbacks:
  #   - my-model: ["my-model-backup"]

general_settings:
  # Модели хранятся в БД и редактируются из UI.
  store_model_in_db: true
